<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Morning Round</title>
<style>
  :root {
    --green: #1b5e20; --green-2: #2e7d32; --green-light: #e8f5e9;
    --blue: #1565c0; --blue-light: #e3f2fd;
    --red: #c62828; --red-light: #ffebee;
    --amber: #ef6c00; --amber-light: #fff3e0;
    --ink: #1a1a1a; --muted: #5f6b5f; --line: #d5dcd5; --bg: #f3f6f3; --card: #fff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); font-size: 18px; line-height: 1.3; padding-bottom: env(safe-area-inset-bottom); }
  header { background: var(--green); color: #fff; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; position: sticky; top: 0; z-index: 10; }
  .hrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  header h1 { font-size: 19px; margin: 0; }
  .badge { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.18); white-space: nowrap; }
  .badge.offline { background: var(--red); } .badge.pending { background: var(--amber); }
  .progress { margin-top: 8px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.25); overflow: hidden; }
  .progress > div { height: 100%; background: #a5d6a7; width: 0; transition: width .3s; }
  .ptext { font-size: 14px; margin-top: 4px; opacity: .95; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 12px 40px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { min-width: 44px; height: 40px; padding: 0 8px; border-radius: 10px; border: 2px solid var(--line); background: #fff; font: inherit; font-weight: 800; font-size: 16px; color: var(--ink); position: relative; cursor: pointer; }
  .chip.done { background: var(--green-light); border-color: #a5d6a7; color: var(--green); }
  .chip.queued { background: var(--amber-light); border-color: #ffcc80; color: var(--amber); }
  .chip.current { border-color: var(--green-2); box-shadow: 0 0 0 2px var(--green-2); }
  .chip.root::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }

  .tray-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .tray-no { font-size: 46px; font-weight: 900; line-height: 1; }
  .tray-no small { font-size: 18px; font-weight: 700; color: var(--muted); display: block; margin-bottom: 2px; }
  .day { text-align: right; font-size: 15px; color: var(--muted); font-weight: 700; }
  .day b { display: block; font-size: 26px; color: var(--ink); }
  .tag { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 6px; background: var(--amber-light); color: var(--amber); }
  .mothers { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
  .last { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: #f6f8f6; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
  .last b { font-size: 18px; }
  .today-note { margin-top: 8px; font-size: 14px; font-weight: 700; color: var(--green-2); }

  .weight-wrap { position: relative; margin-top: 12px; }
  input { font: inherit; -webkit-appearance: none; appearance: none; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  #weightInput { width: 100%; border: 3px solid var(--line); border-radius: 14px; font-size: 44px; font-weight: 800; text-align: center; padding: 10px 56px 10px 14px; min-height: 86px; background: #fff; color: var(--ink); }
  #weightInput:focus { outline: none; border-color: var(--green-2); }
  .unit { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-size: 24px; font-weight: 800; color: var(--muted); pointer-events: none; }

  .db { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .db .cell { border: 2px solid var(--line); border-radius: 12px; padding: 8px; text-align: center; }
  .db .lbl { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .db .num { font-size: 30px; font-weight: 900; line-height: 1.15; }
  .db .cell.main .num { color: var(--amber); }
  .db .cell.none .num { color: #b8c0b8; }

  .rec { margin-top: 10px; border-radius: 12px; padding: 12px 14px; font-size: 18px; font-weight: 800; display: none; }
  .rec.irrigate { display: block; background: var(--blue-light); color: var(--blue); border: 2px solid #90caf9; }
  .rec.ok { display: block; background: var(--green-light); color: var(--green); border: 2px solid #a5d6a7; }
  .rec.info { display: block; background: #f6f8f6; color: var(--muted); border: 2px solid var(--line); font-size: 16px; }
  .rec small { display: block; font-size: 13px; font-weight: 600; opacity: .85; margin-top: 2px; }

  .irr { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  button { font: inherit; border: 0; border-radius: 12px; cursor: pointer; font-weight: 800; }
  .irr button { min-height: 60px; font-size: 19px; background: #fff; border: 2px solid var(--line); color: var(--ink); }
  .irr button.on-yes { background: var(--blue); border-color: var(--blue); color: #fff; }
  .irr button.on-no { background: #455a64; border-color: #455a64; color: #fff; }

  .roots { margin-top: 12px; border: 2px dashed #ffcc80; background: #fffaf2; border-radius: 12px; padding: 10px 12px; }
  .roots h3 { margin: 0 0 6px; font-size: 16px; color: var(--amber); }
  .roots .r { display: grid; grid-template-columns: 1fr 110px auto; align-items: center; gap: 8px; margin-top: 6px; }
  .roots .r span { font-weight: 700; word-break: break-word; }
  .roots .r em { font-style: normal; color: var(--muted); font-size: 15px; white-space: nowrap; }
  .roots input { width: 100%; border: 2px solid var(--line); border-radius: 10px; font-size: 22px; font-weight: 800; text-align: center; padding: 8px; background: #fff; }
  .roots p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

  .save { width: 100%; min-height: 72px; margin-top: 14px; font-size: 24px; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .save:disabled { opacity: .4; }
  .hint { font-size: 14px; font-weight: 700; color: var(--amber); margin-top: 8px; min-height: 18px; text-align: center; }

  .center { text-align: center; padding: 26px 10px; }
  .center .big { font-size: 26px; font-weight: 900; margin: 6px 0; }
  .center button { margin-top: 14px; min-height: 52px; padding: 0 22px; background: #eef2ee; border: 2px solid var(--line); color: var(--ink); font-size: 17px; }
  .sum { text-align: left; margin-top: 14px; font-size: 15px; }
  .sum div { display: flex; justify-content: space-between; padding: 6px 2px; border-bottom: 1px solid #eef0ee; }

  .spinner { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  .spinner.dark { border-color: rgba(0,0,0,.12); border-top-color: var(--green-2); display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toast { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); max-width: 536px; margin: 0 auto; padding: 16px 18px; border-radius: 14px; color: #fff; font-size: 18px; font-weight: 800; box-shadow: 0 6px 24px rgba(0,0,0,.25); transform: translateY(160%); transition: transform .25s; z-index: 50; }
  #toast.show { transform: translateY(0); }
  #toast.success { background: var(--green); } #toast.error { background: var(--red); } #toast.warn { background: var(--amber); } #toast.info { background: #37474f; }
  .foot { text-align: center; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .foot button { background: none; color: var(--muted); text-decoration: underline; font-weight: 600; font-size: 14px; padding: 8px; }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>🌱 Morning Round <span id="dateLbl" style="font-weight:600;opacity:.85"></span></h1>
    <span id="netBadge" class="badge">Online</span>
  </div>
  <div class="progress"><div id="progBar"></div></div>
  <div class="ptext" id="progText">Loading…</div>
</header>

<main>
  <section class="card" id="chipsCard" style="display:none">
    <div class="chips" id="chips"></div>
  </section>

  <section class="card" id="trayCard" style="display:none">
    <div class="tray-head">
      <div class="tray-no"><small>Tray</small><span id="tNo"></span></div>
      <div class="day" id="tDay"></div>
    </div>
    <div class="mothers" id="tMothers"></div>
    <div class="last" id="tLast"></div>
    <div class="today-note" id="tToday"></div>

    <div class="weight-wrap">
      <input id="weightInput" type="number" inputmode="decimal" step="0.1" min="0" placeholder="Weight" aria-label="Weight in grams" autocomplete="off">
      <span class="unit">g</span>
    </div>

    <div class="db">
      <div class="cell main none" id="dbFull"><div class="lbl">Dryback (from full)</div><div class="num">—</div></div>
      <div class="cell none" id="dbPrev"><div class="lbl">Since last</div><div class="num">—</div></div>
    </div>

    <div class="rec" id="rec"></div>

    <div class="irr">
      <button id="irrYes" type="button">💧 Irrigated</button>
      <button id="irrNo" type="button">Not irrigated</button>
    </div>

    <div class="roots" id="roots" style="display:none"></div>

    <button class="save" id="saveBtn" type="button" disabled>Save &amp; next ›</button>
    <div class="hint" id="hint"></div>
  </section>

  <section class="card" id="msgCard" style="display:none"></section>

  <div class="foot"><button id="reloadBtn" type="button">↻ Reload trays</button></div>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyOsuvirg1KZs6F2uKJ0KAy2tVHMiu-_iAiulwBLsbynybTMmjjiyhK_IptGJjPOESR/exec';
const API_URL = WEB_APP_URL.trim().replace(/[?#].*$/, '');
const REQUEST_TIMEOUT_MS = 20000;
const PENDING_KEY = 'round.pending.v2';
const CACHE_KEY = 'round.cache.v2';

const $ = (id) => document.getElementById(id);
const state = {
  data: null,          // round data from server
  idx: -1,             // current tray index
  irrigated: null,     // true/false/null
  irrTouched: false,   // worker changed irrigation by hand
  saving: false
};

/* ---------------- helpers ---------------- */
let toastTimer;
function toast(msg, type = 'info', ms = 2600) {
  const t = $('toast'); t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = type; }, ms);
}
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function g(n) { return (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString(undefined, { maximumFractionDigits: 1 }) + ' g'; }
function ddmm(day) { const m = String(day || '').match(/^\d{4}-(\d{2})-(\d{2})/); return m ? m[2] + '/' + m[1] : ''; }
function pct(ref, w) { return (ref > 0 && w > 0) ? (ref - w) / ref * 100 : null; }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function newId() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); }

async function fetchJson(url, options = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
  try {
    const res = await fetch(url, { ...options, signal: ctrl.signal, redirect: 'follow' });
    const text = await res.text();
    try { return JSON.parse(text); }
    catch (e) { throw new Error('The server returned an error page – check that the newest Code.gs is deployed.'); }
  } catch (err) {
    if (err.name === 'AbortError' || err instanceof TypeError) { const e = new Error('No connection'); e.network = true; throw e; }
    throw err;
  } finally { clearTimeout(timer); }
}
const apiRound = () => fetchJson(API_URL + '?action=round&t=' + Date.now());
const apiPost = (body) => fetchJson(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });

/* ---------------- loading ---------------- */
async function loadRound() {
  $('progText').textContent = 'Loading trays…';
  try {
    const data = await apiRound();
    if (!data.ok) throw new Error(data.error || 'Could not load trays.');
    store(CACHE_KEY, { at: Date.now(), data });
    applyPendingToData(data);
    start(data);
  } catch (err) {
    const cached = load(CACHE_KEY, null);
    if (err.network && cached && cached.data) {
      const d = cached.data;
      const now = todayLocal();
      if (d.today !== now) {
        // cached list is from an earlier day: yesterday's weights become "last", day numbers move on
        const diff = Math.round((Date.parse(now) - Date.parse(d.today)) / 86400000);
        d.trays.forEach((t) => {
          if (t.todayWeight != null) { t.lastWeight = t.todayWeight; t.lastIrrigated = t.todayIrrigated; t.lastDate = d.today; t.todayWeight = null; t.todayIrrigated = null; }
          if (t.day != null) t.day += diff;
          t._queued = false;
        });
        d.today = now;
      }
      applyPendingToData(d);
      start(d);
      toast('Offline – using saved tray list', 'warn', 3500);
    } else {
      showMsg('<div class="center"><div style="font-size:40px">⚠️</div><div class="big">Could not load trays</div><div>' + esc(err.message) + '</div><button type="button" onclick="loadRound()">Try again</button></div>');
    }
  }
}

function todayLocal() { return localDay(new Date()); }
function localDay(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function applyPendingToData(data) {
  // entries saved offline today still count as weighed
  load(PENDING_KEY, []).forEach((p) => {
    const t = data.trays.find((x) => x.tray === p.tray);
    if (t && localDay(new Date(p.clientTimestamp)) === data.today) { t.todayWeight = p.weight; t.todayIrrigated = p.irrigated ? 'Yes' : 'No'; t._queued = true; }
  });
}

function start(data) {
  state.data = data;
  $('dateLbl').textContent = ddmm(data.today);
  if (!data.trays.length) {
    $('chipsCard').style.display = 'none'; $('trayCard').style.display = 'none';
    updateProgress();
    showMsg('<div class="center"><div style="font-size:40px">🪴</div><div class="big">No active trays</div><div>Ask the manager to add trays.</div></div>');
    return;
  }
  $('msgCard').style.display = 'none';
  $('chipsCard').style.display = 'block';
  const first = data.trays.findIndex((t) => t.todayWeight == null);
  if (first < 0) { renderChips(); updateProgress(); showComplete(); return; }
  select(first);
}

/* ---------------- render ---------------- */
function updateProgress() {
  const tr = state.data ? state.data.trays : [];
  const done = tr.filter((t) => t.todayWeight != null).length;
  $('progBar').style.width = tr.length ? (done / tr.length * 100) + '%' : '0';
  $('progText').textContent = tr.length ? done + ' / ' + tr.length + ' trays weighed today' : '';
}

function renderChips() {
  const box = $('chips'); box.innerHTML = '';
  state.data.trays.forEach((t, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (t._queued ? ' queued' : t.todayWeight != null ? ' done' : '') + (i === state.idx ? ' current' : '') + (t.needsRootCount ? ' root' : '');
    b.textContent = t.tray;
    b.addEventListener('click', () => select(i));
    box.appendChild(b);
  });
}

function select(i) {
  state.idx = i;
  const t = state.data.trays[i];
  const s = state.data.settings;
  $('msgCard').style.display = 'none';
  $('trayCard').style.display = 'block';
  renderChips(); updateProgress();

  $('tNo').textContent = t.tray;
  const dayTxt = t.day != null ? 'Day<b>' + t.day + '<span style="font-size:15px;color:var(--muted)"> / ' + s.CycleDays + '</span></b>' : '';
  const tag = (t.day != null && t.day >= s.CycleDays) ? '<div class="tag">Ready to transplant</div>'
    : (t.needsRootCount ? '<div class="tag">Rooting check</div>' : '');
  $('tDay').innerHTML = dayTxt + tag;
  $('tMothers').textContent = (t.cuttings || []).map((c) => (c.mother || 'No mother') + ' ×' + c.initial).join(' · ');
  $('tLast').innerHTML = t.lastWeight != null
    ? '<span>Last (' + ddmm(t.lastDate) + ')' + (t.lastIrrigated === 'Yes' ? ' 💧' : '') + '</span><b>' + g(t.lastWeight) + '</b>'
    : '<span>' + (t.initialWeight ? 'Full weight' : 'First weighing') + '</span><b>' + (t.initialWeight ? g(t.initialWeight) : '—') + '</b>';
  $('tToday').textContent = t.todayWeight != null ? '✓ Already weighed today: ' + g(t.todayWeight) + ' – saving again replaces it' : '';

  $('weightInput').value = t.todayWeight != null ? t.todayWeight : '';
  state.irrigated = t.todayWeight != null ? t.todayIrrigated === 'Yes' : null;
  state.irrTouched = t.todayWeight != null;
  state.bigOk = false;

  renderRoots(t);
  update();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => $('weightInput').focus(), 250);
}

function renderRoots(t) {
  const box = $('roots');
  const open = (t.cuttings || []).filter((c) => c.rooted == null);
  if (!t.needsRootCount || !open.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
  box.style.display = 'block';
  box.innerHTML = '<h3>🌱 Rooting check – how many rooted?</h3>' +
    open.map((c, k) => '<div class="r"><span>' + esc(c.mother || 'No mother') + '</span>' +
      '<input type="number" inputmode="numeric" min="0" step="1" data-k="' + k + '" aria-label="Rooted">' +
      '<em>/ ' + c.initial + '</em></div>').join('') +
    '<p>Leave empty if not counted yet – the tray will ask again tomorrow.</p>';
  box.querySelectorAll('input').forEach((inp) => inp.addEventListener('input', update));
  box._batches = open;
}

const KG_LIMIT = 50;           // anything typed below 50 is read as kilograms (3.36 -> 3360 g)
const BIG_CHANGE_PCT = 35;     // ask for a second tap when the weight is this far from the last/full weight
function rawWeight() { const v = parseFloat(String($('weightInput').value).replace(',', '.')); return isFinite(v) ? v : NaN; }
function currentWeight() { const v = rawWeight(); return v > 0 && v < KG_LIMIT ? Math.round(v * 1000) : v; }

function update() {
  const t = state.data.trays[state.idx];
  const s = state.data.settings;
  const w = currentWeight();
  const full = t.initialWeight;
  const dFull = pct(full, w), dPrev = pct(t.lastWeight, w);

  setCell('dbFull', dFull); setCell('dbPrev', dPrev);

  const rec = $('rec');
  let recommend = null;
  if (!(w > 0)) { rec.className = 'rec'; rec.innerHTML = ''; }
  else if (!(full > 0)) {
    rec.className = 'rec info'; rec.innerHTML = 'First weighing – this will be saved as the full weight.<small>Weigh right after watering.</small>';
  } else if (dFull >= s.DrybackIrrigatePct) {
    recommend = true;
    rec.className = 'rec irrigate'; rec.innerHTML = '💧 Irrigate this tray<small>Dryback ' + dFull.toFixed(1) + '% – limit is ' + s.DrybackIrrigatePct + '%</small>';
  } else {
    recommend = false;
    rec.className = 'rec ok'; rec.innerHTML = '✓ No irrigation needed<small>Dryback ' + (dFull > 0 ? dFull.toFixed(1) : '0') + '% – limit is ' + s.DrybackIrrigatePct + '%</small>';
  }
  if (!state.irrTouched && recommend !== null) state.irrigated = recommend;

  $('irrYes').className = state.irrigated === true ? 'on-yes' : '';
  $('irrNo').className = state.irrigated === false ? 'on-no' : '';

  const rootErr = rootProblem();
  const ref = t.lastWeight > 0 ? t.lastWeight : (full > 0 ? full : null);
  const change = (ref && w > 0) ? Math.abs(w - ref) / ref * 100 : 0;
  state.bigChange = change > BIG_CHANGE_PCT;
  const ok = w > 0 && w <= 100000 && state.irrigated !== null && !rootErr && !state.saving;
  $('saveBtn').innerHTML = state.saving ? $('saveBtn').innerHTML : (state.bigChange && !state.bigOk ? 'Check weight – tap to save anyway' : 'Save &amp; next ›');
  $('saveBtn').style.background = state.bigChange && !state.bigOk ? 'var(--amber)' : '';
  $('saveBtn').disabled = !ok;
  const raw = rawWeight();
  $('hint').textContent = rootErr
    || (state.bigChange ? '⚠ ' + Math.round(change) + '% different from ' + (t.lastWeight > 0 ? 'last' : 'full') + ' weight (' + g(ref) + ') – check the number'
    : (raw > 0 && raw < KG_LIMIT ? 'Read as ' + g(w) + ' (typed in kg)'
    : (w > 0 && state.irrigated === null ? 'Choose: irrigated or not' : '')));
}

function setCell(id, p) {
  const c = $(id), n = c.querySelector('.num');
  n.style.color = '';
  if (p === null) { c.classList.add('none'); n.textContent = '—'; return; }
  c.classList.remove('none');
  if (p >= 0) { n.textContent = p.toFixed(1) + '%'; }
  else { n.innerHTML = '↑' + Math.abs(p).toFixed(1) + '%<span style="display:block;font-size:12px;font-weight:700">heavier</span>'; n.style.color = 'var(--blue)'; }
}

function rootValues() {
  const box = $('roots');
  if (box.style.display === 'none' || !box._batches) return [];
  const out = [];
  box.querySelectorAll('input').forEach((inp) => {
    const v = inp.value.trim();
    if (v === '') return;
    const b = box._batches[+inp.dataset.k];
    out.push({ mother: b.mother, rooted: Number(v), initial: b.initial });
  });
  return out;
}
function rootProblem() {
  for (const r of rootValues()) {
    if (!Number.isInteger(r.rooted) || r.rooted < 0) return 'Rooted must be a whole number';
    if (r.initial != null && r.rooted > r.initial) return (r.mother || 'No mother') + ': rooted is more than ' + r.initial;
  }
  return '';
}

/* ---------------- save ---------------- */
async function save() {
  if (state.saving) return;
  if (state.bigChange && !state.bigOk) { state.bigOk = true; buzz([60, 60, 60]); update(); return; }
  const t = state.data.trays[state.idx];
  const w = Math.round(currentWeight() * 10) / 10;
  if (!(w > 0) || state.irrigated === null) return;
  const entry = {
    action: 'log', tray: t.tray, weight: w, irrigated: state.irrigated,
    rooted: rootValues().map((r) => ({ mother: r.mother, rooted: r.rooted })),
    clientTimestamp: new Date().toISOString(), submissionId: newId()
  };
  state.saving = true;
  $('saveBtn').innerHTML = '<span class="spinner"></span> Saving…';
  update();
  try {
    const res = await apiPost(entry);
    if (!res.ok) throw new Error(res.error || 'Save failed');
    markSaved(t, entry, false, res);
    buzz(120);
    toast('✓ Tray ' + t.tray + ' saved' + (entry.irrigated ? ' · 💧' : ''), 'success', 1600);
    next();
  } catch (err) {
    if (err.network) {
      const q = load(PENDING_KEY, []); q.push(entry); store(PENDING_KEY, q);
      markSaved(t, entry, true, null);
      toast('No signal – saved on phone, will send later', 'warn', 3000);
      updateBadge();
      next();
    } else {
      buzz([200, 100, 200]);
      toast('Error: ' + err.message, 'error', 5000);
    }
  } finally {
    state.saving = false;
    $('saveBtn').innerHTML = 'Save &amp; next ›';
    if (state.data.trays[state.idx]) update();
  }
}

function markSaved(t, entry, queued, res) {
  t.todayWeight = entry.weight;
  t.todayIrrigated = entry.irrigated ? 'Yes' : 'No';
  t._queued = queued;
  if (!(t.initialWeight > 0)) t.initialWeight = entry.weight;
  entry.rooted.forEach((r) => {
    const b = (t.cuttings || []).find((c) => (c.mother || '').toLowerCase() === (r.mother || '').toLowerCase());
    if (b) b.rooted = r.rooted;
  });
  t.needsRootCount = t.needsRootCount && (t.cuttings || []).some((c) => c.rooted == null);
  store(CACHE_KEY, { at: Date.now(), data: state.data });
}

function next() {
  const tr = state.data.trays;
  for (let k = 1; k <= tr.length; k++) {
    const i = (state.idx + k) % tr.length;
    if (tr[i].todayWeight == null) { select(i); return; }
  }
  renderChips(); updateProgress(); showComplete();
}

function showComplete() {
  $('trayCard').style.display = 'none';
  const tr = state.data.trays;
  const irr = tr.filter((t) => t.todayIrrigated === 'Yes').map((t) => t.tray);
  showMsg('<div class="center"><div style="font-size:44px">✅</div><div class="big">Round complete</div>' +
    '<div>' + tr.length + ' / ' + tr.length + ' trays weighed</div>' +
    '<div class="sum"><div><span>💧 Irrigated</span><b>' + (irr.length ? irr.join(', ') : 'none') + '</b></div>' +
    '<div><span>Not irrigated</span><b>' + (tr.length - irr.length) + ' trays</b></div></div>' +
    '<div style="margin-top:10px;font-size:14px;color:var(--muted)">Tap a tray number above to fix a weight.</div></div>');
}

function showMsg(html) { const m = $('msgCard'); m.innerHTML = html; m.style.display = 'block'; }

/* ---------------- offline queue ---------------- */
let flushing = false;
async function flush() {
  if (flushing) return;
  let q = load(PENDING_KEY, []);
  if (!q.length) { updateBadge(); return; }
  flushing = true;
  let sent = 0;
  try {
    for (const e of [...q]) {
      try {
        const res = await apiPost(e);
        q = q.filter((x) => x.submissionId !== e.submissionId); store(PENDING_KEY, q);
        if (res.ok) sent++; else toast('Tray ' + e.tray + ': ' + res.error, 'error', 5000);
        const t = state.data && state.data.trays.find((x) => x.tray === e.tray);
        if (t) t._queued = false;
      } catch (err) { break; }
    }
  } finally { flushing = false; }
  if (sent) { toast('✓ Sent ' + sent + ' saved-offline weighing' + (sent > 1 ? 's' : ''), 'success'); if (state.data) renderChips(); }
  updateBadge();
}
function updateBadge() {
  const n = load(PENDING_KEY, []).length, b = $('netBadge');
  if (!navigator.onLine) { b.textContent = 'Offline' + (n ? ' · ' + n : ''); b.className = 'badge offline'; }
  else if (n) { b.textContent = n + ' to send'; b.className = 'badge pending'; }
  else { b.textContent = 'Online'; b.className = 'badge'; }
}

/* ---------------- wire up ---------------- */
$('weightInput').addEventListener('input', () => { state.bigOk = false; update(); });
$('weightInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('weightInput').blur(); if (!$('saveBtn').disabled) save(); } });
$('irrYes').addEventListener('click', () => { state.irrigated = true; state.irrTouched = true; buzz(25); update(); });
$('irrNo').addEventListener('click', () => { state.irrigated = false; state.irrTouched = true; buzz(25); update(); });
$('saveBtn').addEventListener('click', save);
$('reloadBtn').addEventListener('click', () => { flush().then(loadRound); });
window.addEventListener('online', () => { updateBadge(); flush(); });
window.addEventListener('offline', updateBadge);
setInterval(() => { if (navigator.onLine) flush(); }, 60000);

updateBadge();
flush().then(loadRound);
</script>
</body>
