<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Tray Weights</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --green: #1b5e20;
    --green-2: #2e7d32;
    --green-light: #e8f5e9;
    --red: #c62828;
    --red-light: #ffebee;
    --amber: #ef6c00;
    --amber-light: #fff3e0;
    --ink: #1a1a1a;
    --muted: #5f6b5f;
    --line: #d5dcd5;
    --bg: #f3f6f3;
    --card: #ffffff;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 18px;
    line-height: 1.35;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    background: var(--green);
    color: #fff;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .badge {
    font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,.18); white-space: nowrap;
  }
  .badge.offline { background: var(--red); }
  .badge.pending { background: var(--amber); }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px 40px; }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 16px;
    margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .step { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px; }
  #reader {
    width: 100%; border-radius: 10px; overflow: hidden; background: #000;
    display: none; margin-bottom: 12px;
  }
  #reader.active { display: block; }
  #reader video { width: 100% !important; height: auto !important; display: block; }
  button {
    font: inherit; border: 0; border-radius: 12px; cursor: pointer;
    min-height: 60px; width: 100%; font-weight: 700; font-size: 20px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .05s, opacity .2s;
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--green-2); color: #fff; }
  .btn-secondary { background: #eef2ee; color: var(--ink); border: 2px solid var(--line); }
  .btn-danger { background: var(--red-light); color: var(--red); border: 2px solid #f3c1c1; }
  .btn-submit { background: var(--green); color: #fff; min-height: 72px; font-size: 24px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .manual { display: flex; gap: 8px; margin-top: 12px; }
  .manual input { flex: 1; }
  .manual button { width: auto; min-width: 96px; font-size: 17px; min-height: 56px; padding: 0 14px; }
  input {
    font: inherit; width: 100%; border: 2px solid var(--line); border-radius: 12px;
    padding: 14px; font-size: 20px; background: #fff; color: var(--ink); min-height: 56px;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input { -webkit-appearance: none; appearance: none; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  input:focus { outline: none; border-color: var(--green-2); box-shadow: 0 0 0 3px rgba(46,125,50,.2); }
  .weight-wrap { position: relative; }
  .weight-wrap input { font-size: 40px; font-weight: 700; text-align: center; padding-right: 54px; min-height: 84px; }
  .weight-wrap .unit { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-size: 24px; font-weight: 700; color: var(--muted); pointer-events: none; }
  .tray { border: 2px solid var(--line); border-radius: 12px; padding: 14px; min-height: 70px; }
  .tray.found { border-color: var(--green-2); background: var(--green-light); }
  .tray.notfound { border-color: var(--red); background: var(--red-light); }
  .tray.loading { border-style: dashed; }
  .tray-name { font-size: 26px; font-weight: 800; margin: 2px 0 6px; word-break: break-word; }
  .tray-meta { font-size: 15px; color: var(--muted); display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  .tray-meta b { color: var(--ink); font-weight: 600; }
  .placeholder { color: var(--muted); font-size: 16px; }
  .hint { font-size: 15px; margin-top: 8px; min-height: 20px; font-weight: 600; }
  .hint.warn { color: var(--amber); }
  .hint.ok { color: var(--green-2); }
  .spinner { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  .spinner.dark { border-color: rgba(0,0,0,.15); border-top-color: var(--green-2); display: inline-block; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toast {
    position: fixed; left: 12px; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom));
    max-width: 536px; margin: 0 auto; padding: 18px 20px; border-radius: 14px;
    color: #fff; font-size: 19px; font-weight: 700; box-shadow: 0 6px 24px rgba(0,0,0,.25);
    transform: translateY(150%); transition: transform .25s ease; z-index: 50;
  }
  #toast.show { transform: translateY(0); }
  #toast.success { background: var(--green); }
  #toast.error { background: var(--red); }
  #toast.info { background: #37474f; }
  #toast.warn { background: var(--amber); }
  .config-warning { background: var(--red-light); color: var(--red); border: 2px solid var(--red); border-radius: 12px; padding: 14px; font-weight: 600; margin-bottom: 14px; display: none; }
  .last-box {
    margin-top: 12px; background: #fff; border: 2px solid var(--line); border-radius: 10px;
    padding: 10px 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  .last-box .lbl { font-size: 14px; color: var(--muted); font-weight: 600; }
  .last-box .val { font-size: 24px; font-weight: 800; }
  .last-box .when { font-size: 13px; color: var(--muted); display: block; text-align: right; }
  .dryback { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .dryback .cell { border: 2px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .dryback .cell .lbl { font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .dryback .cell .num { font-size: 30px; font-weight: 800; line-height: 1.2; }
  .dryback .cell .sub { font-size: 13px; color: var(--muted); }
  .dryback .cell.loss .num { color: var(--amber); }
  .dryback .cell.gain .num { color: #1565c0; }
  .dryback .cell.none .num { color: #b0b8b0; }
  .irr-label { font-size: 14px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
  .irr { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .irr button { background: #fff; border: 2px solid var(--line); color: var(--ink); min-height: 60px; font-size: 19px; }
  .irr button.on-yes { background: #1565c0; border-color: #1565c0; color: #fff; }
  .irr button.on-no { background: #455a64; border-color: #455a64; color: #fff; }
  .reg { margin-top: 12px; display: grid; gap: 10px; }
  .reg label { font-size: 14px; font-weight: 700; color: var(--muted); display: block; margin-bottom: 4px; }
  .reg .row button { min-height: 56px; font-size: 18px; }
  .cut-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
  }
  .cut-row .m { font-size: 19px; font-weight: 800; word-break: break-word; }
  .cut-row .d { font-size: 14px; color: var(--muted); }
  .cut-row .pct { font-size: 22px; font-weight: 800; color: var(--green-2); white-space: nowrap; }
  .cut-row .pct.pending { font-size: 14px; color: var(--amber); font-weight: 700; }
  .cut-row button { width: auto; min-height: 44px; font-size: 15px; padding: 0 12px; }
  .cut-total { font-size: 15px; color: var(--muted); font-weight: 600; margin: 4px 0 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .last-saved { font-size: 14px; color: var(--muted); text-align: center; margin-top: 10px; min-height: 18px; }
  .pending-bar { display: none; margin-top: 10px; }
  .pending-bar button { min-height: 48px; font-size: 16px; }
  /* hide html5-qrcode's own extra UI bits */
  #reader__dashboard_section_csr, #reader__header_message { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>🌱 Tray Weights</h1>
  <span id="netBadge" class="badge">Online</span>
</header>

<main>
  <div id="configWarning" class="config-warning">
    Setup needed: paste your Google Apps Script Web App URL into <code>WEB_APP_URL</code> in this file.
  </div>

  <!-- STEP 1: SCAN -->
  <section class="card">
    <p class="step">1 · Scan tray</p>
    <div id="reader"></div>
    <button id="scanBtn" class="btn-primary" type="button">📷 Scan Barcode</button>
    <button id="stopBtn" class="btn-danger" type="button" style="display:none">✕ Stop Camera</button>
    <form id="manualForm" class="manual" autocomplete="off">
      <input id="manualInput" type="text" inputmode="text" placeholder="…or type barcode" aria-label="Barcode">
      <button class="btn-secondary" type="submit">Find</button>
    </form>
  </section>

  <!-- STEP 2: CONFIRM TRAY -->
  <section class="card">
    <p class="step">2 · Check tray</p>
    <div id="trayBox" class="tray">
      <div class="placeholder">No tray scanned yet.</div>
    </div>
  </section>

  <!-- STEP 3: WEIGHT + SUBMIT -->
  <section class="card">
    <p class="step">3 · Enter weight</p>
    <form id="weightForm" autocomplete="off">
      <div class="weight-wrap">
        <input id="weightInput" type="number" inputmode="decimal" step="0.1" min="0" placeholder="0" aria-label="Weight in grams" disabled>
        <span class="unit">g</span>
      </div>
      <div id="drybackBox" class="dryback" style="display:none">
        <div id="dbLast" class="cell none"><div class="lbl">Dryback vs last</div><div class="num">—</div><div class="sub"></div></div>
        <div id="dbInit" class="cell none"><div class="lbl">Vs initial</div><div class="num">—</div><div class="sub"></div></div>
      </div>
      <div class="irr-label">Irrigation</div>
      <div class="irr" role="group" aria-label="Irrigation">
        <button id="irrYes" type="button" disabled>💧 Irrigated</button>
        <button id="irrNo" type="button" disabled>No irrigation</button>
      </div>
      <div id="weightHint" class="hint"></div>
      <button id="submitBtn" class="btn-submit" type="submit" disabled style="margin-top:12px">Save Weight</button>
    </form>
    <div id="lastSaved" class="last-saved"></div>
    <div id="pendingBar" class="pending-bar">
      <button id="retryBtn" class="btn-secondary" type="button">↻ Send <span id="pendingCount">0</span> saved-offline entries</button>
    </div>
  </section>

  <!-- STEP 4: CUTTINGS -->
  <section class="card" id="cutCard" style="display:none">
    <p class="step">4 · Cuttings &amp; rooting</p>
    <div id="cutTotal" class="cut-total"></div>
    <div id="cutList"></div>
    <button id="cutAddBtn" class="btn-secondary" type="button">➕ Add cuttings</button>
    <form id="cutForm" class="reg" style="display:none" autocomplete="off">
      <div id="cutFormTitle" class="tray-name" style="font-size:20px;margin:0">Add cuttings</div>
      <div>
        <label for="cutMother">Mother (optional)</label>
        <input id="cutMother" type="text" list="motherList" maxlength="80" placeholder="e.g. M12">
        <datalist id="motherList"></datalist>
      </div>
      <div class="grid2">
        <div><label for="cutInitial">Initial cuttings</label>
          <input id="cutInitial" type="number" inputmode="numeric" min="1" step="1"></div>
        <div><label for="cutRooted">Rooted</label>
          <input id="cutRooted" type="number" inputmode="numeric" min="0" step="1" placeholder="later"></div>
      </div>
      <div id="cutHint" class="hint"></div>
      <div class="row">
        <button id="cutCancel" type="button" class="btn-secondary">Cancel</button>
        <button id="cutSave" type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   CONFIGURATION — paste your deployed Apps Script Web App URL here.
   It looks like: https://script.google.com/macros/s/AKfy..../exec
   ===================================================================== */
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyOsuvirg1KZs6F2uKJ0KAy2tVHMiu-_iAiulwBLsbynybTMmjjiyhK_IptGJjPOESR/exec';

/* Options */
const AUTO_RESTART_SCANNER = true;   // reopen camera after each successful save
const BIG_CHANGE_WARN_PCT = 40;      // warn if weight differs from last by more than this %
const REQUEST_TIMEOUT_MS = 20000;
const PENDING_KEY = 'trayWeights.pending.v1';

/* ===================================================================== */

const $ = (id) => document.getElementById(id);
const els = {
  reader: $('reader'), scanBtn: $('scanBtn'), stopBtn: $('stopBtn'),
  manualForm: $('manualForm'), manualInput: $('manualInput'),
  trayBox: $('trayBox'), weightForm: $('weightForm'), weightInput: $('weightInput'),
  weightHint: $('weightHint'), irrYes: $('irrYes'), irrNo: $('irrNo'), drybackBox: $('drybackBox'), dbLast: $('dbLast'), dbInit: $('dbInit'), submitBtn: $('submitBtn'), lastSaved: $('lastSaved'),
  toast: $('toast'), netBadge: $('netBadge'), configWarning: $('configWarning'),
  cutCard: $('cutCard'), cutTotal: $('cutTotal'), cutList: $('cutList'), cutAddBtn: $('cutAddBtn'),
  cutForm: $('cutForm'), cutFormTitle: $('cutFormTitle'), cutMother: $('cutMother'), motherList: $('motherList'),
  cutInitial: $('cutInitial'), cutRooted: $('cutRooted'), cutHint: $('cutHint'), cutCancel: $('cutCancel'), cutSave: $('cutSave'),
  pendingBar: $('pendingBar'), pendingCount: $('pendingCount'), retryBtn: $('retryBtn')
};

const state = {
  tray: null,          // { barcode, trayName, initialWeight, lastWeight, lastTimestamp, lastIrrigated }
  irrigated: null,     // true / false / null (not chosen yet)
  mothers: [],         // all mother names used so far (for suggestions)
  cutEdit: null,       // batch being edited, or null for a new batch
  scanner: null,
  scanning: false,
  handlingScan: false,
  submitting: false,
  lookupSeq: 0
};

const isConfigured = () => /^https:\/\/script\.google\.com\/.+\/exec$/.test(WEB_APP_URL.trim());

/* ---------------- Notifications ---------------- */
let toastTimer;
function toast(msg, type = 'info', ms = 3000) {
  els.toast.textContent = msg;
  els.toast.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { els.toast.className = type; }, ms);
}
function buzz(pattern) { try { navigator.vibrate && navigator.vibrate(pattern); } catch (e) {} }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtG(n) {
  if (n === null || n === undefined || n === '' || isNaN(Number(n))) return '—';
  return Number(n).toLocaleString(undefined, { maximumFractionDigits: 1 }) + ' g';
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  return d.toLocaleString(undefined, { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

/* ---------------- Network helpers ---------------- */
async function fetchJson(url, options = {}) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
  try {
    const res = await fetch(url, { ...options, signal: ctrl.signal, redirect: 'follow' });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch (e) { throw new Error('Unexpected server reply. Check the Web App is deployed with access "Anyone".'); }
    return data;
  } catch (err) {
    if (err.name === 'AbortError') { const e = new Error('Request timed out.'); e.network = true; throw e; }
    if (err instanceof TypeError) { const e = new Error('No connection to server.'); e.network = true; throw e; }
    throw err;
  } finally {
    clearTimeout(t);
  }
}

function apiLookup(barcode) {
  const url = WEB_APP_URL + '?action=lookup&barcode=' + encodeURIComponent(barcode) + '&t=' + Date.now();
  return fetchJson(url, { method: 'GET' });
}

function apiPost(payload) {
  // text/plain avoids a CORS preflight, which Apps Script does not support
  return fetchJson(WEB_APP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
}
function apiSave(entry) { return apiPost({ ...entry, action: 'log' }); }
function apiSetCuttings(barcode, mother, initial, rooted) {
  return apiPost({ action: 'setCuttings', barcode, mother, initial, rooted });
}
function apiAddTray(barcode, trayName, initialWeight) {
  return apiPost({ action: 'addTray', barcode, trayName, initialWeight });
}

/* ---------------- Scanner ---------------- */
function buildScanner() {
  const F = window.Html5QrcodeSupportedFormats;
  const formats = F ? [
    F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E,
    F.ITF, F.CODABAR, F.QR_CODE, F.DATA_MATRIX
  ] : undefined;
  return new Html5Qrcode('reader', {
    verbose: false,
    formatsToSupport: formats,
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  });
}

async function startScanner() {
  if (state.scanning) return;
  if (!window.Html5Qrcode) {
    toast('Scanner library failed to load. Check internet, or type the barcode.', 'error', 5000);
    return;
  }
  if (!window.isSecureContext) {
    toast('Camera needs HTTPS. Open this page from an https:// address.', 'error', 6000);
    return;
  }
  try {
    if (!state.scanner) state.scanner = buildScanner();
    els.reader.classList.add('active');
    els.scanBtn.style.display = 'none';
    els.stopBtn.style.display = 'flex';
    state.handlingScan = false;

    await state.scanner.start(
      { facingMode: 'environment' },
      {
        fps: 12,
        // wide box suits 1D barcodes on tray labels
        qrbox: (w, h) => {
          const width = Math.max(150, Math.floor(w * 0.88));
          const height = Math.max(80, Math.floor(Math.min(h, w) * 0.5));
          return { width, height };
        },
        disableFlip: false
      },
      onScanSuccess,
      () => {} // per-frame "not found" — ignore
    );
    state.scanning = true;
  } catch (err) {
    resetScannerUi();
    const msg = String(err && (err.message || err)).toLowerCase();
    if (msg.includes('permission') || msg.includes('notallowed')) {
      toast('Camera permission denied. Allow camera access in browser settings.', 'error', 6000);
    } else if (msg.includes('notfound') || msg.includes('no camera')) {
      toast('No camera found on this device.', 'error', 5000);
    } else {
      toast('Could not start camera: ' + (err.message || err), 'error', 6000);
    }
  }
}

async function stopScanner() {
  try {
    if (state.scanner && state.scanning) await state.scanner.stop();
  } catch (e) { /* already stopped */ }
  state.scanning = false;
  resetScannerUi();
}

function resetScannerUi() {
  els.reader.classList.remove('active');
  els.scanBtn.style.display = 'flex';
  els.stopBtn.style.display = 'none';
}

async function onScanSuccess(decodedText) {
  if (state.handlingScan) return;
  state.handlingScan = true;
  buzz(80);
  await stopScanner();
  lookupBarcode(decodedText);
}

/* ---------------- Lookup ---------------- */
async function lookupBarcode(raw) {
  const barcode = String(raw || '').trim();
  if (!barcode) return;
  if (!isConfigured()) { toast('WEB_APP_URL is not set in index.html.', 'error', 5000); return; }

  const seq = ++state.lookupSeq;
  state.tray = null;
  state.irrigated = null;
  renderCuttings();
  updateFormState();
  els.manualInput.value = '';
  els.trayBox.className = 'tray loading';
  els.trayBox.innerHTML = '<span class="spinner dark"></span> Looking up <b>' + escapeHtml(barcode) + '</b>…';

  try {
    const data = await apiLookup(barcode);
    if (seq !== state.lookupSeq) return; // a newer scan superseded this one
    if (!data.ok) throw new Error(data.error || 'Lookup failed.');

    if (!data.found) {
      renderUnknown(barcode);
      buzz([60, 60, 60]);
      toast('Barcode not registered.', 'error', 3500);
      return;
    }

    state.tray = data;
    if (data.mothers) state.mothers = data.mothers;
    renderTray(data);
    renderCuttings();
    updateFormState();
    toast('Tray found: ' + data.trayName, 'success', 1800);
    setTimeout(() => els.weightInput.focus(), 150);
  } catch (err) {
    if (seq !== state.lookupSeq) return;
    els.trayBox.className = 'tray notfound';
    els.trayBox.innerHTML =
      '<div class="tray-name">Lookup failed</div>' +
      '<div class="tray-meta"><span>Barcode</span><b>' + escapeHtml(barcode) + '</b></div>' +
      '<div class="hint" style="color:var(--red)">' + escapeHtml(err.message) + '</div>';
    toast(err.message, 'error', 4500);
  }
}

function renderTray(t, isNew) {
  els.trayBox.className = 'tray found';
  const meta =
    '<span>Barcode</span><b>' + escapeHtml(t.barcode) + '</b>' +
    '<span>Initial</span><b>' + fmtG(t.initialWeight) + '</b>';
  const hasLast = t.lastWeight !== null && t.lastWeight !== undefined;
  const lastBox =
    '<div class="last-box"><span class="lbl">Last recorded</span><span>' +
    (hasLast
      ? '<span class="val">' + fmtG(t.lastWeight) + '</span><span class="when">' + escapeHtml(fmtDate(t.lastTimestamp)) +
        (t.lastIrrigated === 'Yes' ? ' · 💧 irrigated' : t.lastIrrigated === 'No' ? ' · not irrigated' : '') + '</span>'
      : '<span class="lbl">No weighings yet</span>') +
    '</span></div>';
  els.trayBox.innerHTML =
    '<div class="tray-name">✓ ' + escapeHtml(t.trayName) + '</div>' +
    (isNew ? '<div class="hint ok" style="margin:0 0 6px">New tray registered</div>' : '') +
    '<div class="tray-meta">' + meta + '</div>' + lastBox;
}

/* ---------------- Unknown tray + registration ---------------- */
function renderUnknown(barcode) {
  els.trayBox.className = 'tray notfound';
  els.trayBox.innerHTML =
    '<div class="tray-name">Unknown tray</div>' +
    '<div class="tray-meta"><span>Barcode</span><b>' + escapeHtml(barcode) + '</b></div>' +
    '<div class="hint" style="color:var(--red)">Not found in Trays_Master.</div>' +
    '<button id="regOpenBtn" type="button" class="btn-primary" style="margin-top:10px">➕ Register this tray</button>';
  $('regOpenBtn').addEventListener('click', () => renderRegisterForm(barcode));
}

function renderRegisterForm(barcode) {
  els.trayBox.className = 'tray';
  els.trayBox.innerHTML =
    '<div class="tray-name" style="font-size:22px">New tray</div>' +
    '<div class="tray-meta"><span>Barcode</span><b>' + escapeHtml(barcode) + '</b></div>' +
    '<form id="regForm" class="reg" autocomplete="off">' +
      '<div><label for="regName">Tray name *</label>' +
      '<input id="regName" type="text" maxlength="120" required></div>' +
      '<div><label for="regWeight">Initial weight (g) – optional</label>' +
      '<input id="regWeight" type="number" inputmode="decimal" step="0.1" min="0"></div>' +
      '<div class="row">' +
        '<button id="regCancel" type="button" class="btn-secondary">Cancel</button>' +
        '<button id="regSave" type="submit" class="btn-primary">Save tray</button>' +
      '</div>' +
    '</form>';
  $('regCancel').addEventListener('click', () => renderUnknown(barcode));
  $('regForm').addEventListener('submit', (e) => submitRegister(e, barcode));
  setTimeout(() => { const n = $('regName'); if (n) n.focus(); }, 100);
}

async function submitRegister(e, barcode) {
  e.preventDefault();
  const name = $('regName').value.trim();
  const wRaw = $('regWeight').value.trim().replace(',', '.');
  if (!name) { toast('Enter a tray name.', 'error'); $('regName').focus(); return; }
  if (wRaw && !(parseFloat(wRaw) > 0)) { toast('Initial weight must be a positive number.', 'error'); return; }

  const btn = $('regSave');
  btn.disabled = true; $('regCancel').disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Saving…';
  try {
    const res = await apiAddTray(barcode, name, wRaw ? parseFloat(wRaw) : '');
    if (!res.ok) throw new Error(res.error || 'Could not register tray.');
    buzz(120);
    toast('✓ Tray registered: ' + res.trayName, 'success', 2500);
    state.tray = res;
    if (res.mothers) state.mothers = res.mothers;
    renderTray(res, true);
    renderCuttings();
    updateFormState();
    setTimeout(() => els.weightInput.focus(), 150);
  } catch (err) {
    toast(err.network ? 'No connection – registering a tray needs internet.' : 'Error: ' + err.message, 'error', 5000);
    btn.disabled = false; $('regCancel').disabled = false;
    btn.textContent = 'Save tray';
  }
}

/* ---------------- Cuttings & rooting ---------------- */
function renderCuttings() {
  const t = state.tray;
  closeCutForm();
  if (!t) { els.cutCard.style.display = 'none'; return; }
  els.cutCard.style.display = 'block';

  els.motherList.innerHTML = state.mothers.map((m) => '<option value="' + escapeHtml(m) + '">').join('');

  const list = t.cuttings || [];
  if (!list.length) {
    els.cutTotal.textContent = '';
    els.cutList.innerHTML = '<div class="placeholder" style="margin-bottom:10px">No cuttings recorded for this tray.</div>';
    return;
  }
  let init = 0, rooted = 0, counted = 0;
  list.forEach((b) => { init += b.initial || 0; if (b.rooted !== null) { rooted += b.rooted; counted += b.initial || 0; } });
  els.cutTotal.textContent = 'Tray total: ' + init + ' cuttings' +
    (counted ? ' · rooted ' + rooted + '/' + counted + ' (' + (rooted / counted * 100).toFixed(1) + '%)' : '');

  els.cutList.innerHTML = '';
  list.forEach((b, i) => {
    const row = document.createElement('div');
    row.className = 'cut-row';
    const pct = b.rooted !== null
      ? '<div class="pct">' + (b.rootingPct !== null ? b.rootingPct.toFixed(1) : '0') + '%</div>'
      : '<div class="pct pending">not counted</div>';
    row.innerHTML =
      '<div><div class="m">' + escapeHtml(b.mother || 'No mother') + '</div>' +
      '<div class="d">' + b.initial + ' cuttings' + (b.rooted !== null ? ' · ' + b.rooted + ' rooted' : '') + '</div></div>' +
      pct + '<button type="button" class="btn-secondary">' + (b.rooted !== null ? 'Edit' : 'Rooted') + '</button>';
    row.querySelector('button').addEventListener('click', () => openCutForm(list[i]));
    els.cutList.appendChild(row);
  });
}

function openCutForm(batch) {
  state.cutEdit = batch || null;
  els.cutForm.style.display = 'grid';
  els.cutAddBtn.style.display = 'none';
  els.cutHint.textContent = ''; els.cutHint.className = 'hint';
  if (batch) {
    els.cutFormTitle.textContent = 'Update: ' + (batch.mother || 'No mother');
    els.cutMother.value = batch.mother || '';
    els.cutMother.disabled = true;
    els.cutInitial.value = batch.initial != null ? batch.initial : '';
    els.cutRooted.value = batch.rooted != null ? batch.rooted : '';
    setTimeout(() => els.cutRooted.focus(), 100);
  } else {
    els.cutFormTitle.textContent = 'Add cuttings';
    els.cutMother.value = '';
    els.cutMother.disabled = false;
    els.cutInitial.value = '';
    els.cutRooted.value = '';
    setTimeout(() => els.cutMother.focus(), 100);
  }
  updateCutHint();
}

function closeCutForm() {
  state.cutEdit = null;
  els.cutForm.style.display = 'none';
  els.cutAddBtn.style.display = 'flex';
  els.cutMother.disabled = false;
  els.cutSave.disabled = false; els.cutCancel.disabled = false;
  els.cutSave.textContent = 'Save';
}

function readCount(input) {
  const v = input.value.trim();
  if (v === '') return null;
  const n = Number(v);
  return (Number.isInteger(n) && n >= 0) ? n : NaN;
}

function updateCutHint() {
  const i = readCount(els.cutInitial), r = readCount(els.cutRooted);
  els.cutHint.className = 'hint'; els.cutHint.textContent = '';
  if (Number.isNaN(i) || Number.isNaN(r)) { els.cutHint.className = 'hint warn'; els.cutHint.textContent = 'Use whole numbers only.'; return; }
  if (i !== null && r !== null) {
    if (r > i) { els.cutHint.className = 'hint warn'; els.cutHint.textContent = 'Rooted cannot be more than initial.'; return; }
    if (i > 0) { els.cutHint.className = 'hint ok'; els.cutHint.textContent = 'Rooting: ' + (r / i * 100).toFixed(1) + '%'; }
  }
}

async function submitCuttings(e) {
  e.preventDefault();
  if (!state.tray) return;
  const mother = state.cutEdit ? (state.cutEdit.mother || '') : els.cutMother.value.trim();
  const initial = readCount(els.cutInitial), rooted = readCount(els.cutRooted);
  if (Number.isNaN(initial) || Number.isNaN(rooted)) { toast('Use whole numbers only.', 'error'); return; }
  if (!state.cutEdit && !(initial >= 1)) { toast('Enter the initial number of cuttings.', 'error'); els.cutInitial.focus(); return; }
  if (initial !== null && rooted !== null && rooted > initial) { toast('Rooted cannot be more than initial.', 'error'); return; }
  if (!state.cutEdit) {
    const dup = (state.tray.cuttings || []).find((b) => (b.mother || '').toLowerCase() === mother.toLowerCase());
    if (dup) { toast('This mother is already in the tray – tap its Edit/Rooted button.', 'warn', 4000); return; }
  }

  els.cutSave.disabled = true; els.cutCancel.disabled = true;
  els.cutSave.innerHTML = '<span class="spinner"></span> Saving…';
  try {
    const res = await apiSetCuttings(state.tray.barcode, mother, initial === null ? '' : initial, rooted === null ? '' : rooted);
    if (!res.ok) throw new Error(res.error || 'Could not save cuttings.');
    buzz(100);
    state.tray.cuttings = res.cuttings || [];
    if (res.mothers) state.mothers = res.mothers;
    toast('✓ Cuttings saved' + (mother ? ' – ' + mother : ''), 'success', 2200);
    renderCuttings();
  } catch (err) {
    toast(err.network ? 'No connection – cuttings need internet to save.' : 'Error: ' + err.message, 'error', 5000);
    els.cutSave.disabled = false; els.cutCancel.disabled = false;
    els.cutSave.textContent = 'Save';
  }
}

/* ---------------- Weight input ---------------- */
function currentWeight() {
  const v = parseFloat(String(els.weightInput.value).replace(',', '.'));
  return isFinite(v) ? v : NaN;
}

function updateFormState() {
  const hasTray = !!state.tray;
  els.weightInput.disabled = !hasTray || state.submitting;
  els.irrYes.disabled = els.irrNo.disabled = !hasTray || state.submitting;
  els.irrYes.className = state.irrigated === true ? 'on-yes' : '';
  els.irrNo.className = state.irrigated === false ? 'on-no' : '';
  const w = currentWeight();
  const valid = hasTray && w > 0 && w <= 100000 && state.irrigated !== null;
  els.submitBtn.disabled = !valid || state.submitting;
  updateWeightHint(w);
  if (hasTray && w > 0 && state.irrigated === null && !els.weightHint.textContent) {
    els.weightHint.className = 'hint warn';
    els.weightHint.textContent = 'Choose irrigation: 💧 Irrigated or No irrigation.';
  }
}

/* Dryback % = (reference - current) / reference × 100. Positive = weight lost. */
function drybackPct(ref, w) {
  if (!(ref > 0) || !(w > 0)) return null;
  return (ref - w) / ref * 100;
}

function setDbCell(cell, ref, w, label) {
  const num = cell.querySelector('.num');
  const sub = cell.querySelector('.sub');
  const pct = drybackPct(ref, w);
  if (pct === null) {
    cell.className = 'cell none';
    num.textContent = '—';
    sub.textContent = ref > 0 ? fmtG(ref) : 'no ' + label;
    return;
  }
  const diff = w - ref;
  if (pct >= 0) { cell.className = 'cell loss'; num.textContent = pct.toFixed(1) + '%'; }
  else { cell.className = 'cell gain'; num.textContent = '+' + Math.abs(pct).toFixed(1) + '%'; }
  sub.textContent = (diff >= 0 ? '+' : '−') + Math.abs(diff).toFixed(1) + ' g · from ' + fmtG(ref);
}

function updateWeightHint(w) {
  const t = state.tray;
  els.weightHint.className = 'hint';
  els.weightHint.textContent = '';
  if (!t) { els.drybackBox.style.display = 'none'; return; }

  els.drybackBox.style.display = 'grid';
  setDbCell(els.dbLast, t.lastWeight, w, 'previous weight');
  setDbCell(els.dbInit, t.initialWeight, w, 'initial weight');

  const ref = (t.lastWeight > 0) ? t.lastWeight : (t.initialWeight > 0 ? t.initialWeight : null);
  const pct = drybackPct(ref, w);
  if (pct !== null && Math.abs(pct) > BIG_CHANGE_WARN_PCT) {
    els.weightHint.className = 'hint warn';
    els.weightHint.textContent = '⚠ ' + Math.abs(pct).toFixed(0) + '% different from ' + (t.lastWeight > 0 ? 'last' : 'initial') + ' weight — double-check.';
  }
}

function setIrrigated(v) {
  state.irrigated = (state.irrigated === v) ? null : v; // tap again to clear
  buzz(30);
  updateFormState();
}

/* ---------------- Submit ---------------- */
function newId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

async function submitWeight(e) {
  e.preventDefault();
  if (state.submitting || !state.tray) return;
  const w = currentWeight();
  if (!(w > 0)) { toast('Enter a valid weight.', 'error'); return; }
  if (state.irrigated === null) { toast('Choose irrigation: yes or no.', 'error'); return; }

  const entry = {
    barcode: state.tray.barcode,
    weight: Math.round(w * 10) / 10,
    irrigated: state.irrigated,
    clientTimestamp: new Date().toISOString(),
    submissionId: newId()
  };
  const trayName = state.tray.trayName;

  state.submitting = true;
  els.submitBtn.innerHTML = '<span class="spinner"></span> Saving…';
  updateFormState();

  try {
    const res = await apiSave(entry);
    if (!res.ok) throw new Error(res.error || 'Save failed.');
    buzz(150);
    const db = (res.dryback !== null && res.dryback !== undefined)
      ? ' · dryback ' + (res.dryback >= 0 ? res.dryback.toFixed(1) + '%' : '+' + Math.abs(res.dryback).toFixed(1) + '% gain')
      : '';
    const irr = entry.irrigated ? ' · 💧' : '';
    toast('✓ Saved ' + fmtG(entry.weight) + db + irr + ' — ' + trayName, 'success', 3000);
    els.lastSaved.textContent = 'Last saved: ' + trayName + ' · ' + fmtG(entry.weight) + db + irr + ' · ' + fmtDate(entry.clientTimestamp);
    finishEntry();
  } catch (err) {
    if (err.network) {
      addPending({ ...entry, trayName });
      buzz([60, 60, 60]);
      toast('No connection — saved on phone, will send later.', 'warn', 4000);
      els.lastSaved.textContent = 'Queued offline: ' + trayName + ' · ' + fmtG(entry.weight);
      finishEntry();
    } else {
      buzz([200, 100, 200]);
      toast('Error: ' + err.message, 'error', 5000);
    }
  } finally {
    state.submitting = false;
    els.submitBtn.textContent = 'Save Weight';
    updateFormState();
  }
}

function finishEntry() {
  state.tray = null;
  state.irrigated = null;
  renderCuttings();
  els.weightInput.value = '';
  els.weightInput.blur();
  els.trayBox.className = 'tray';
  els.trayBox.innerHTML = '<div class="placeholder">Ready for the next tray.</div>';
  updateFormState();
  if (AUTO_RESTART_SCANNER) setTimeout(startScanner, 600);
}

/* ---------------- Offline queue ---------------- */
function readPending() {
  try { return JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); } catch (e) { return []; }
}
function writePending(list) {
  try { localStorage.setItem(PENDING_KEY, JSON.stringify(list)); } catch (e) {}
  renderPending();
}
function addPending(entry) { const l = readPending(); l.push(entry); writePending(l); }

function renderPending() {
  const n = readPending().length;
  els.pendingCount.textContent = n;
  els.pendingBar.style.display = n ? 'block' : 'none';
  updateNetBadge();
}

let flushing = false;
async function flushPending(showToast) {
  if (flushing || !isConfigured()) return;
  let list = readPending();
  if (!list.length) return;
  flushing = true;
  let sent = 0, failed = 0;
  try {
    for (const entry of [...list]) {
      try {
        const res = await apiSave(entry);
        if (res.ok) {
          sent++;
          list = list.filter((x) => x.submissionId !== entry.submissionId);
          writePending(list);
        } else {
          // server rejected it (e.g. barcode deleted) — drop it but tell the user
          failed++;
          list = list.filter((x) => x.submissionId !== entry.submissionId);
          writePending(list);
          toast('Dropped queued entry for ' + entry.barcode + ': ' + res.error, 'error', 5000);
        }
      } catch (err) {
        break; // still offline — stop and try later
      }
    }
  } finally {
    flushing = false;
  }
  if (sent && showToast !== false) toast('✓ Sent ' + sent + ' queued entr' + (sent === 1 ? 'y' : 'ies') + '.', 'success', 3000);
  else if (showToast && !sent && !failed) toast('Still offline. Will retry automatically.', 'warn', 3000);
}

function updateNetBadge() {
  const n = readPending().length;
  if (!navigator.onLine) { els.netBadge.textContent = 'Offline' + (n ? ' · ' + n + ' queued' : ''); els.netBadge.className = 'badge offline'; }
  else if (n) { els.netBadge.textContent = n + ' queued'; els.netBadge.className = 'badge pending'; }
  else { els.netBadge.textContent = 'Online'; els.netBadge.className = 'badge'; }
}

/* ---------------- Wire up ---------------- */
els.scanBtn.addEventListener('click', startScanner);
els.stopBtn.addEventListener('click', stopScanner);
els.manualForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const v = els.manualInput.value.trim();
  if (!v) { els.manualInput.focus(); return; }
  stopScanner();
  els.manualInput.blur();
  lookupBarcode(v);
});
els.weightInput.addEventListener('input', updateFormState);
els.irrYes.addEventListener('click', () => setIrrigated(true));
els.cutAddBtn.addEventListener('click', () => openCutForm(null));
els.cutCancel.addEventListener('click', closeCutForm);
els.cutForm.addEventListener('submit', submitCuttings);
els.cutInitial.addEventListener('input', updateCutHint);
els.cutRooted.addEventListener('input', updateCutHint);
els.irrNo.addEventListener('click', () => setIrrigated(false));
els.weightForm.addEventListener('submit', submitWeight);
els.retryBtn.addEventListener('click', () => flushPending(true));
window.addEventListener('online', () => { updateNetBadge(); flushPending(); });
window.addEventListener('offline', updateNetBadge);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state.scanning) stopScanner(); // release camera when app is backgrounded
});

if (!isConfigured()) els.configWarning.style.display = 'block';
renderPending();
updateFormState();
if (navigator.onLine) flushPending();
setInterval(() => { if (navigator.onLine) flushPending(false); }, 60000);
</script>
</body>
</html>
