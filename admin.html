<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tray Admin</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f3f6f3; color: #1a1a1a; }
  .boot { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 14px; font-size: 18px; padding: 20px; text-align: center; }
  .spin { width: 34px; height: 34px; border: 4px solid #cfd8cf; border-top-color: #2e7d32; border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 12px 20px; background: #2e7d32; color: #fff; }
</style>
</head>
<body>
<div class="boot" id="boot"><div class="spin"></div><div>Loading…</div></div>
<script>
/* Permanent shell – the app itself is loaded from the TrayApp folder in Google Drive
   through the Apps Script, so updates need no change here. */
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbyOsuvirg1KZs6F2uKJ0KAy2tVHMiu-_iAiulwBLsbynybTMmjjiyhK_IptGJjPOESR/exec';
  var PAGE = 'admin';
  var KEY = 'shell.' + PAGE + '.html';
  function show(html) { document.open(); document.write(html); document.close(); }
  function cached() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function fail(msg) {
    document.getElementById('boot').innerHTML = '<div style="font-size:40px">⚠️</div><div>' + msg + '</div><button onclick="location.reload()">Try again</button>';
  }
  function get(attempt) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);
    fetch(API + '?action=page&name=' + PAGE + '&t=' + Date.now(), { redirect: 'follow', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        clearTimeout(timer);
        var j = null;
        try { j = JSON.parse(txt); } catch (e) {}
        if (!j) { if (attempt < 2) return get(attempt + 1); throw new Error('server'); }   // Google sometimes returns a temporary error page
        if (!j.ok || !j.html) throw new Error(j.error || 'no page');
        try { localStorage.setItem(KEY, j.html); } catch (e) {}
        show(j.html);
      })
      .catch(function (err) {
        clearTimeout(timer);
        var c = cached();
        if (c) show(c);                      // offline or server hiccup: open the last version saved on this phone
        else fail('Could not load the app (' + (err && err.message ? err.message : 'no connection') + ').');
      });
  }
  get(0);
})();
</script>
</body>
</html>
